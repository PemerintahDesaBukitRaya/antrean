<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display IKD & Perlinsos - Desa Bukit Raya</title>
<style>
:root{
  --blue:#073b82;--blue2:#116bb4;--cyan:#19a6c7;--green:#1e9b61;
  --yellow:#f4c64e;--white:#fff;--text:#17324d;--muted:#74879a;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  font-family:Arial,Helvetica,sans-serif;color:var(--text);overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 18%,rgba(25,166,199,.12),transparent 27%),
    radial-gradient(circle at 92% 12%,rgba(17,107,180,.12),transparent 28%),
    linear-gradient(135deg,#edf5fb 0%,#f9fbfd 52%,#eef6fb 100%);
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(2px);opacity:.45;
}
body:before{
  width:420px;height:420px;left:-230px;bottom:-220px;
  background:radial-gradient(circle,rgba(25,166,199,.12),transparent 68%);
  animation:floatA 11s ease-in-out infinite alternate;
}
body:after{
  width:360px;height:360px;right:-190px;top:38%;
  background:radial-gradient(circle,rgba(7,59,130,.10),transparent 68%);
  animation:floatB 13s ease-in-out infinite alternate;
}
@keyframes floatA{to{transform:translate(80px,-35px)}}
@keyframes floatB{to{transform:translate(-65px,40px)}}

.header{
  position:relative;overflow:hidden;color:#fff;padding:25px 28px;text-align:center;
  background:linear-gradient(120deg,#06377a,#0b5fa9 55%,#138ab9);
  box-shadow:0 9px 28px rgba(8,58,105,.18);
}
.header:before{
  content:"";position:absolute;inset:0;opacity:.12;
  background-image:
    linear-gradient(rgba(255,255,255,.25) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.25) 1px,transparent 1px);
  background-size:34px 34px;
  animation:gridMove 14s linear infinite;
}
@keyframes gridMove{to{background-position:34px 34px}}
.header-inner{position:relative;z-index:1}
.header .eyebrow{
  font-size:clamp(12px,1.2vw,15px);font-weight:900;letter-spacing:.11em;
  opacity:.92;
}
.header h1{
  margin:5px 0 0;font-size:clamp(25px,3.2vw,44px);line-height:1.08;
  text-shadow:0 3px 15px rgba(0,0,0,.15);
}
.header-meta{
  margin-top:9px;font-size:13px;opacity:.84;font-weight:700;
}
.clock{
  position:absolute;right:22px;top:18px;font-weight:900;font-size:15px;
  padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.20);backdrop-filter:blur(8px);
}
.grid{
  position:relative;z-index:1;width:min(1600px,calc(100% - 34px));margin:20px auto 24px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;
}
.card{
  position:relative;overflow:hidden;min-height:260px;
  background:rgba(255,255,255,.91);border:1px solid rgba(210,225,237,.9);
  border-radius:22px;box-shadow:0 13px 32px rgba(16,53,92,.10);
  backdrop-filter:blur(10px);display:flex;flex-direction:column;
  animation:cardIn .5s ease both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.card:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--blue2),var(--cyan));
}
.card.active:after{
  content:"";position:absolute;inset:-2px;border-radius:23px;
  border:2px solid rgba(25,166,199,.0);pointer-events:none;
  animation:glow 2.2s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{border-color:rgba(25,166,199,.04);box-shadow:0 0 0 rgba(25,166,199,0)}
  50%{border-color:rgba(25,166,199,.28);box-shadow:0 0 28px rgba(25,166,199,.12)}
}
.card-head{
  padding:13px 16px 13px 20px;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(249,252,255,.96),rgba(243,248,252,.92));
  border-bottom:1px solid #dce7ef;
}
.desk{font-weight:950;color:var(--blue);font-size:18px;letter-spacing:.02em}
.status{
  font-size:11px;font-weight:950;padding:6px 9px;border-radius:999px;
  background:#edf1f5;color:#718096;
}
.status.called{background:#fff0cf;color:#805d00}
.status.serving{background:#e4f7eb;color:#14733f}
.status.done{background:#def1f2;color:#176267}
.card-body{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;
}
.number{
  font-size:clamp(38px,4.2vw,62px);font-weight:950;line-height:1;color:var(--blue);
  letter-spacing:.015em;
}
.name{
  font-size:clamp(16px,1.55vw,23px);font-weight:950;margin-top:10px;
  text-transform:uppercase;line-height:1.15;
}
.origin{font-size:12px;color:var(--muted);margin-top:5px}
.call-text{
  margin-top:15px;font-size:clamp(14px,1.4vw,19px);font-weight:950;
  color:var(--blue2);line-height:1.2;
}
.idle-number{font-size:54px;font-weight:950;color:#a7b4c1}
.idle-text{margin-top:7px;font-weight:900;color:#8a99a8}
.done-wrap .number{color:var(--green)}
.done-wrap .call-text{color:var(--green)}
.footer{text-align:center;color:#8190a0;font-size:12px;padding:0 0 18px}
.notice{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);
  z-index:10;background:rgba(7,59,130,.94);color:#fff;padding:11px 17px;
  border-radius:999px;font-size:13px;font-weight:900;box-shadow:0 10px 25px rgba(0,0,0,.18);
  opacity:0;pointer-events:none;transition:.25s;
}
.notice.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:780px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock{position:static;display:inline-block;margin-top:10px}
}
@media(max-width:500px){
  .grid{grid-template-columns:1fr;width:calc(100% - 18px);gap:12px}
  .card{min-height:225px}
}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="eyebrow">PELAYANAN AKTIVASI IKD DAN PENDAFTARAN PERLINSOS</div>
    <h1>DISPLAY ANTREAN PELAYANAN</h1>
    <div class="header-meta">Nomor antrean akan dipanggil sesuai meja pelayanan</div>
    <div id="clock" class="clock">--:--:--</div>
  </div>
</header>

<main id="grid" class="grid"></main>
<div class="footer">Pemerintah Desa Bukit Raya</div>
<div id="notice" class="notice">Display diperbarui</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pyawggjlbrvneflpsalj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_5SdvMobBB2AvtXcJd_Scxw_rVsoqM8R";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const grid=document.getElementById("grid");
const clock=document.getElementById("clock");
const notice=document.getElementById("notice");

let deskCount=6;
let previousRows=[];
let doneCards=new Map();
let soundEnabled=true;
let audioContext=null;

function esc(v){
  return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;")
    .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function statusText(status){
  if(status==="called") return "DIPANGGIL";
  if(status==="serving") return "SEDANG DILAYANI";
  if(status==="done") return "SELESAI";
  return "SIAP";
}
function cardHtml(row){
  const done=row.status==="done",called=row.status==="called";
  return `
    <section class="card ${done?"done-wrap":"active"}">
      <div class="card-head">
        <div class="desk">MEJA ${row.meja_pelayanan}</div>
        <div class="status ${done?"done":(called?"called":"serving")}">${statusText(row.status)}</div>
      </div>
      <div class="card-body">
        <div>
          <div class="number">${esc(row.queue_code)}</div>
          <div class="name">${esc(row.customer_name)}</div>
          <div class="origin">${esc(row.asal_desa_kelurahan||"")}</div>
          <div class="call-text">${done?"PELAYANAN SELESAI":(called?"SILAKAN MENUJU MEJA "+row.meja_pelayanan:"SEDANG DILAYANI")}</div>
        </div>
      </div>
    </section>`;
}
function idleHtml(row){
  return `
    <section class="card">
      <div class="card-head">
        <div class="desk">MEJA ${row.meja_pelayanan}</div>
        <div class="status">SIAP</div>
      </div>
      <div class="card-body">
        <div>
          <div class="idle-number">0</div>
          <div class="idle-text">MENUNGGU ANTREAN</div>
        </div>
      </div>
    </section>`;
}
function render(rows){
  const map=new Map(rows.map(r=>[Number(r.meja_pelayanan),r]));
  const cards=[];
  for(let i=1;i<=deskCount;i++){
    const row=map.get(i);
    const done=doneCards.get(i);
    if(done && Date.now()<done.until){
      cards.push(cardHtml({
        meja_pelayanan:i,queue_code:done.queue_code,customer_name:done.customer_name,
        asal_desa_kelurahan:done.asal_desa_kelurahan,status:"done"
      }));
    }else if(row && (row.status==="called" || row.status==="serving")){
      cards.push(cardHtml(row));
    }else{
      cards.push(idleHtml({meja_pelayanan:i}));
    }
  }
  grid.innerHTML=cards.join("");
}
function normalizeRows(data){
  return (data||[]).map(r=>({...r,meja_pelayanan:Number(r.meja_pelayanan)}));
}
function digitWords(code){
  const m=String(code||"").match(/(\d{3})$/);
  if(!m)return String(code||"");
  const map={"0":"nol","1":"satu","2":"dua","3":"tiga","4":"empat","5":"lima","6":"enam","7":"tujuh","8":"delapan","9":"sembilan"};
  return m[1].split("").map(x=>map[x]||x).join(" ");
}
function unlockAudio(){
  try{
    if(!audioContext) audioContext=new (window.AudioContext||window.webkitAudioContext)();
    if(audioContext.state==="suspended") audioContext.resume();
  }catch(e){}
}
function speakText(text){
  if(!soundEnabled || !("speechSynthesis" in window))return;
  unlockAudio();
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="id-ID";u.rate=.88;u.pitch=1;u.volume=1;
  window.speechSynthesis.speak(u);
}
function playChime(after){
  if(!soundEnabled){after();return}
  try{
    unlockAudio();
    if(!audioContext || audioContext.state==="suspended"){after();return}
    const now=audioContext.currentTime;
    [659.25,783.99,987.77].forEach((freq,i)=>{
      const osc=audioContext.createOscillator();
      const gain=audioContext.createGain();
      osc.type="sine";osc.frequency.value=freq;
      gain.gain.setValueAtTime(.0001,now+i*.16);
      gain.gain.exponentialRampToValueAtTime(.18,now+i*.16+.025);
      gain.gain.exponentialRampToValueAtTime(.0001,now+i*.16+.13);
      osc.connect(gain);gain.connect(audioContext.destination);
      osc.start(now+i*.16);osc.stop(now+i*.16+.14);
    });
    setTimeout(after,650);
  }catch(e){after()}
}
function announce(row){
  if(!soundEnabled)return;
  const words=digitWords(row.queue_code);
  const name=String(row.customer_name||"").trim();
  playChime(()=>speakText(`Nomor antrean I K D ${words}, atas nama ${name}, silakan menuju meja pelayanan ${row.meja_pelayanan}.`));
}
function showNotice(text){
  notice.textContent=text;notice.classList.add("show");
  setTimeout(()=>notice.classList.remove("show"),1800);
}
function detectChanges(rows){
  const oldMap=new Map(previousRows.map(r=>[Number(r.meja_pelayanan),r]));
  rows.forEach(row=>{
    const old=oldMap.get(row.meja_pelayanan);
    if((row.status==="called" || row.status==="serving") && row.last_call_at){
      const oldCall=old?.last_call_at||"";
      if(row.last_call_at!==oldCall && previousRows.length>0) announce(row);
    }
    if(old && (old.status==="called" || old.status==="serving") && row.status==="idle"){
      doneCards.set(row.meja_pelayanan,{
        queue_code:old.queue_code,customer_name:old.customer_name,
        asal_desa_kelurahan:old.asal_desa_kelurahan,until:Date.now()+5000
      });
    }
  });
  previousRows=rows;
}
async function loadConfig(){
  const {data,error}=await db.rpc("get_jumlah_meja_ikd_perlinsos");
  if(error)throw new Error(error.message);
  return Math.max(1,Math.min(50,Number(data)||6));
}
async function load(){
  try{
    const newCount=await loadConfig();
    if(newCount!==deskCount){
      deskCount=newCount;
      // Reset baseline so changing the number of desks cannot cause
      // an old call to be announced again.
      previousRows=[];
      doneCards.clear();
      showNotice("Jumlah meja diperbarui menjadi "+deskCount);
    }
    const {data,error}=await db.rpc("get_meja_ikd_perlinsos",{p_jumlah_meja:deskCount});
    if(error)throw new Error(error.message);
    const rows=normalizeRows(data);
    detectChanges(rows);
    render(rows);
  }catch(e){
    console.error(e);
    grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:34px;color:#b4232e;font-weight:900">Gagal memuat display: ${esc(e.message)}</div>`;
  }
}
function tick(){
  clock.textContent=new Date().toLocaleTimeString("id-ID",{hour12:false});
  let expired=false;
  for(const [desk,item] of doneCards){
    if(Date.now()>=item.until){doneCards.delete(desk);expired=true}
  }
  if(expired)render(previousRows);
}

// Browser policy can suspend audio until the first interaction.
// There is no visible sound control; any interaction with the page
// silently unlocks audio for subsequent calls.
["pointerdown","keydown","touchstart"].forEach(ev=>{
  document.addEventListener(ev,unlockAudio,{once:false,passive:true});
});

setInterval(tick,1000);
setInterval(load,1500);
load();
</script>
</body>
</html>
